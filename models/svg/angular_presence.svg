<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="ui-sans-serif,system-ui,sans-serif"><rect width="900" height="520" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161c"/></marker></defs><text x="30" y="34" font-size="17" fill="#12161c" text-anchor="start" font-weight="600" font-style="normal">Law 3 — presence is an angle, not a size</text><text x="30" y="56" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">All four subjects at the same 1 m distance. Only the angle differs, and the device must match it.</text><line x1="272" y1="80" x2="272" y2="500" stroke="#6b7684" stroke-width="1" stroke-dasharray="3 4"/><text x="272" y="74" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">all at 1 m</text><line x1="84" y1="292" x2="298" y2="122.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="84" y1="292" x2="298" y2="462.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="259" y="122.0" width="26" height="340.0" fill="#12a37a" fill-opacity="0.10" stroke="#12a37a" stroke-width="2" rx="3"/><text x="318" y="137.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">80.7°</text><text x="364" y="137.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">standing body</text><text x="518" y="137.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">1.70 m</text><line x1="84" y1="292" x2="298" y2="212.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="84" y1="292" x2="298" y2="372.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="259" y="212.0" width="26" height="160.0" fill="#12a37a" fill-opacity="0.10" stroke="#12a37a" stroke-width="2" rx="3"/><text x="318" y="227.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">43.6°</text><text x="364" y="227.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">seated upper body</text><text x="518" y="227.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">0.80 m</text><line x1="84" y1="292" x2="298" y2="242.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="84" y1="292" x2="298" y2="342.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="259" y="242.0" width="26" height="100.0" fill="#12a37a" fill-opacity="0.10" stroke="#12a37a" stroke-width="2" rx="3"/><text x="318" y="257.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">28.1°</text><text x="364" y="257.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">head + shoulders</text><text x="518" y="257.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">0.50 m</text><line x1="84" y1="292" x2="298" y2="270.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="84" y1="292" x2="298" y2="314.0" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="259" y="270.0" width="26" height="44.0" fill="#12a37a" fill-opacity="0.10" stroke="#12a37a" stroke-width="2" rx="3"/><text x="318" y="285.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">12.6°</text><text x="364" y="285.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">face</text><text x="518" y="285.0" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">0.22 m</text><circle cx="72" cy="292" r="13" fill="none" stroke="#12161c" stroke-width="2.2"/><circle cx="72" cy="292" r="5" fill="#12161c"/><text x="72" y="326" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">eye</text><text x="30" y="494" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">A 10 cm device reaches 12.6° — a life-size face — at 45 cm, where a phone already sits. FaceTime at 40 cm subtends 19.9°; a real person at 1.2 m, 10.5°.</text></svg>