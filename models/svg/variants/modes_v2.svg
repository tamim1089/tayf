<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <text x="56" y="40" font-size="19" font-weight="600" fill="#0f1419">The two aperture modes</text>
    <text x="56" y="64" font-size="13" font-weight="400" fill="#5b6672">An image in front of the aperture can never be wider than it; an image behind it has no such limit.</text>
    <line x1="56" y1="80" x2="904" y2="80" stroke="#d8dee6" stroke-width="1"/>
    <line x1="480" y1="94" x2="480" y2="466" stroke="#d8dee6" stroke-width="1"/>

    <!-- ================= LEFT PANEL : IN-FRONT ================= -->
    <rect x="56" y="94" width="408" height="372" rx="5" fill="#0f1419" fill-opacity="0.03" stroke="#d8dee6" stroke-width="1"/>
    <rect x="76" y="105" width="4" height="17" rx="1" fill="#0f1419"/>
    <text x="88" y="119" font-size="15" font-weight="700" fill="#0f1419">IN-FRONT (Law 1)</text>
    <text x="444" y="119" text-anchor="end" font-size="11.5" font-weight="400" fill="#5b6672">order: eye -&gt; image -&gt; aperture</text>
    <line x1="76" y1="132" x2="444" y2="132" stroke="#d8dee6" stroke-width="1"/>

    <polygon points="90,254 410,220 410,288" fill="#b8860b" fill-opacity="0.10"/>
    <line x1="90" y1="254" x2="410" y2="220" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line x1="90" y1="254" x2="410" y2="288" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>

    <path d="M 76 254 Q 90 240.5 104 254 Q 90 267.5 76 254 Z" fill="#ffffff" stroke="#0f1419" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="90" cy="254" r="4.5" fill="#0f1419"/>
    <text x="90" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">EYE</text>

    <circle cx="330" cy="241.5" r="11.5" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="2"/>
    <path d="M 313 275 C 313 260 319 254.5 330 254.5 C 341 254.5 347 260 347 275 Q 330 281.5 313 275 Z" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="2" stroke-linejoin="round"/>
    <text x="330" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">IMAGE</text>

    <line x1="330" y1="228.5" x2="353" y2="228.5" stroke="#d8dee6" stroke-width="1"/>
    <line x1="330" y1="279.5" x2="353" y2="279.5" stroke="#d8dee6" stroke-width="1"/>
    <line x1="358" y1="228.5" x2="358" y2="279.5" stroke="#0d9668" stroke-width="1.2"/>
    <line x1="353" y1="228.5" x2="363" y2="228.5" stroke="#0d9668" stroke-width="1.2"/>
    <line x1="353" y1="279.5" x2="363" y2="279.5" stroke="#0d9668" stroke-width="1.2"/>
    <text x="368" y="258.5" font-size="13" font-weight="700" fill="#0d9668">W</text>

    <rect x="405" y="172" width="10" height="48" rx="2" fill="#2563a8" fill-opacity="0.14" stroke="#2563a8" stroke-width="2"/>
    <rect x="405" y="288" width="10" height="48" rx="2" fill="#2563a8" fill-opacity="0.14" stroke="#2563a8" stroke-width="2"/>
    <text x="410" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">APERTURE</text>

    <line x1="415" y1="220" x2="421" y2="220" stroke="#d8dee6" stroke-width="1"/>
    <line x1="415" y1="288" x2="421" y2="288" stroke="#d8dee6" stroke-width="1"/>
    <line x1="426" y1="220" x2="426" y2="288" stroke="#2563a8" stroke-width="1.2"/>
    <line x1="421" y1="220" x2="431" y2="220" stroke="#2563a8" stroke-width="1.2"/>
    <line x1="421" y1="288" x2="431" y2="288" stroke="#2563a8" stroke-width="1.2"/>
    <text x="436" y="258.5" font-size="13" font-weight="700" fill="#2563a8">D</text>

    <line x1="90" y1="272" x2="90" y2="396" stroke="#d8dee6" stroke-width="1"/>
    <line x1="330" y1="286" x2="330" y2="366" stroke="#d8dee6" stroke-width="1"/>
    <line x1="410" y1="340" x2="410" y2="396" stroke="#d8dee6" stroke-width="1"/>

    <line x1="90" y1="360" x2="330" y2="360" stroke="#5b6672" stroke-width="1"/>
    <line x1="90" y1="355" x2="90" y2="365" stroke="#5b6672" stroke-width="1"/>
    <line x1="330" y1="355" x2="330" y2="365" stroke="#5b6672" stroke-width="1"/>
    <text x="210" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1419">b</text>

    <line x1="90" y1="390" x2="410" y2="390" stroke="#5b6672" stroke-width="1"/>
    <line x1="90" y1="385" x2="90" y2="395" stroke="#5b6672" stroke-width="1"/>
    <line x1="410" y1="385" x2="410" y2="395" stroke="#5b6672" stroke-width="1"/>
    <text x="250" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1419">a</text>

    <rect x="76" y="402" width="368" height="32" rx="3" fill="#ffffff" stroke="#d8dee6" stroke-width="1"/>
    <line x1="77.5" y1="404" x2="77.5" y2="432" stroke="#0f1419" stroke-width="3"/>
    <text x="92" y="424" font-size="17" font-weight="700"><tspan fill="#0d9668">W</tspan><tspan fill="#0f1419"> &lt;= </tspan><tspan fill="#2563a8">D</tspan></text>
    <text x="428" y="424" text-anchor="end" font-size="11.5" font-weight="400" fill="#5b6672">b &lt; a, so W can never exceed D</text>
    <text x="260" y="454" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6672">a 20 cm device shows a 20 cm head, in the viewer's own space</text>

    <!-- ================= RIGHT PANEL : PORTAL ================= -->
    <rect x="496" y="94" width="408" height="372" rx="5" fill="#0f1419" fill-opacity="0.03" stroke="#d8dee6" stroke-width="1"/>
    <rect x="516" y="105" width="4" height="17" rx="1" fill="#0f1419"/>
    <text x="528" y="119" font-size="15" font-weight="700" fill="#0f1419">PORTAL (Law 2)</text>
    <text x="884" y="119" text-anchor="end" font-size="11.5" font-weight="400" fill="#5b6672">order: eye -&gt; aperture -&gt; image</text>
    <line x1="516" y1="132" x2="884" y2="132" stroke="#d8dee6" stroke-width="1"/>

    <polygon points="530,254 820,169 820,339" fill="#b8860b" fill-opacity="0.10"/>
    <line x1="530" y1="254" x2="820" y2="169" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line x1="530" y1="254" x2="820" y2="339" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>

    <path d="M 516 254 Q 530 240.5 544 254 Q 530 267.5 516 254 Z" fill="#ffffff" stroke="#0f1419" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="530" cy="254" r="4.5" fill="#0f1419"/>
    <text x="530" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">EYE</text>

    <rect x="641" y="172" width="10" height="48" rx="2" fill="#2563a8" fill-opacity="0.14" stroke="#2563a8" stroke-width="2"/>
    <rect x="641" y="288" width="10" height="48" rx="2" fill="#2563a8" fill-opacity="0.14" stroke="#2563a8" stroke-width="2"/>
    <text x="646" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">APERTURE</text>

    <line x1="651" y1="220" x2="659" y2="220" stroke="#d8dee6" stroke-width="1"/>
    <line x1="651" y1="288" x2="659" y2="288" stroke="#d8dee6" stroke-width="1"/>
    <line x1="664" y1="220" x2="664" y2="288" stroke="#2563a8" stroke-width="1.2"/>
    <line x1="659" y1="220" x2="669" y2="220" stroke="#2563a8" stroke-width="1.2"/>
    <line x1="659" y1="288" x2="669" y2="288" stroke="#2563a8" stroke-width="1.2"/>
    <text x="674" y="258.5" font-size="13" font-weight="700" fill="#2563a8">D</text>

    <circle cx="820" cy="185" r="13" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="2"/>
    <path d="M 798 240 C 798 220 806 209 820 209 C 834 209 842 220 842 240 L 842 284 L 834 284 L 834 336 L 825 336 L 825 282 L 815 282 L 815 336 L 806 336 L 806 284 L 798 284 Z" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="2" stroke-linejoin="round"/>
    <text x="820" y="152" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">IMAGE</text>

    <line x1="820" y1="169" x2="847" y2="169" stroke="#d8dee6" stroke-width="1"/>
    <line x1="820" y1="339" x2="847" y2="339" stroke="#d8dee6" stroke-width="1"/>
    <line x1="852" y1="169" x2="852" y2="339" stroke="#0d9668" stroke-width="1.2"/>
    <line x1="847" y1="169" x2="857" y2="169" stroke="#0d9668" stroke-width="1.2"/>
    <line x1="847" y1="339" x2="857" y2="339" stroke="#0d9668" stroke-width="1.2"/>
    <text x="862" y="258.5" font-size="13" font-weight="700" fill="#0d9668">W</text>

    <line x1="530" y1="272" x2="530" y2="396" stroke="#d8dee6" stroke-width="1"/>
    <line x1="646" y1="340" x2="646" y2="366" stroke="#d8dee6" stroke-width="1"/>
    <line x1="820" y1="344" x2="820" y2="396" stroke="#d8dee6" stroke-width="1"/>

    <line x1="530" y1="360" x2="646" y2="360" stroke="#5b6672" stroke-width="1"/>
    <line x1="530" y1="355" x2="530" y2="365" stroke="#5b6672" stroke-width="1"/>
    <line x1="646" y1="355" x2="646" y2="365" stroke="#5b6672" stroke-width="1"/>
    <text x="588" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1419">a</text>

    <line x1="530" y1="390" x2="820" y2="390" stroke="#5b6672" stroke-width="1"/>
    <line x1="530" y1="385" x2="530" y2="395" stroke="#5b6672" stroke-width="1"/>
    <line x1="820" y1="385" x2="820" y2="395" stroke="#5b6672" stroke-width="1"/>
    <text x="675" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1419">b</text>

    <rect x="516" y="402" width="368" height="32" rx="3" fill="#ffffff" stroke="#d8dee6" stroke-width="1"/>
    <line x1="517.5" y1="404" x2="517.5" y2="432" stroke="#0f1419" stroke-width="3"/>
    <text x="532" y="424" font-size="17" font-weight="700"><tspan fill="#0d9668">W</tspan><tspan fill="#0f1419"> = </tspan><tspan fill="#2563a8">D</tspan><tspan fill="#0f1419"> * (b/a)</tspan></text>
    <text x="868" y="424" text-anchor="end" font-size="11.5" font-weight="400" fill="#5b6672">b &gt; a, so W grows without limit</text>
    <text x="700" y="454" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6672">a 20 cm device shows a full standing person at 2.55 m</text>

    <!-- ================= FOOTER ================= -->
    <text x="56" y="486" font-size="11.5" font-weight="400" fill="#5b6672">Both are legitimate. Conflating them is the easiest technical error in this project.</text>
    <text x="904" y="486" text-anchor="end" font-size="11.5" font-weight="400" fill="#5b6672">a = eye to aperture   |   b = eye to image   |   W/D drawn true to b/a</text>

  </g>
</svg>
