<text x="176" y="358" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">Retro-reflection:</text>
<text x="176" y="374" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">every ray returns</text>
<text x="176" y="390" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">on its own line.</text>

<text x="700" y="104" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5b6672">SEQUENCE</text>

