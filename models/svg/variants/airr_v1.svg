<text x="709" y="281" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
<text x="726" y="281" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">The return pass transmits</text>
<text x="726" y="296" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">through the splitter and</text>
<text x="726" y="311" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">converges in open air.</text>

