<text x="726" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">Source panel emits diffuse</text>
<text x="726" y="143" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">light over a wide cone.</text>

