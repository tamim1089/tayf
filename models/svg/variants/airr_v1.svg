<text x="56" y="472" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">Three static elements. Nothing scans, spins or moves. Viewing angle 170 deg measured (Yamamoto 2017, DOI 10.11370/isj.56.341).</text>
<text x="56" y="487" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672">Unit magnification: image size = source size.</text>

