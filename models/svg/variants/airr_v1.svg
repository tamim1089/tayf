<text x="56" y="40" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#0f1419">AIRR ray path</text>
<text x="904" y="39" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#5b6672">AERIAL IMAGING BY RETRO-REFLECTION</text>
<text x="56" y="64" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#5b6672">A beamsplitter folds source light onto a retroreflector; the return pass converges to a real image in mid-air.</text>
<line x1="56" y1="78" x2="904" y2="78" stroke="#d8dee6" stroke-width="1"/>

