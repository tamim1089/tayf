<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- ================= header ================= -->
  <text x="56" y="40" font-size="19" font-weight="600" fill="#0f1419">Presence is an angle</text>
  <text x="56" y="64" font-size="13" font-weight="400" fill="#5b6672">Distance is fixed at 1.00 m, so angular size is the only variable - and it is what a display must match.</text>

  <!-- ====== nested cones of vision (gold tint, deeper where cones overlap) ====== -->
  <polygon points="96,250 288,86.8 288,413.2" fill="#fcfaf4" stroke="none"/>
  <polygon points="96,250 288,173.2 288,326.8" fill="#f9f4e9" stroke="none"/>
  <polygon points="96,250 288,202 288,298" fill="#f6efdf" stroke="none"/>
  <polygon points="96,250 288,228.88 288,271.12" fill="#f3ebd6" stroke="none"/>

  <!-- ====== sight rays: eye to the top and bottom of each subject ====== -->
  <g stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round">
    <line x1="126" y1="224.5" x2="288" y2="86.8"/>
    <line x1="126" y1="275.5" x2="288" y2="413.2"/>
    <line x1="126" y1="238" x2="288" y2="173.2"/>
    <line x1="126" y1="262" x2="288" y2="326.8"/>
    <line x1="126" y1="242.5" x2="288" y2="202"/>
    <line x1="126" y1="257.5" x2="288" y2="298"/>
    <line x1="126" y1="246.7" x2="288" y2="228.88"/>
    <line x1="126" y1="253.3" x2="288" y2="271.12"/>
  </g>

  <!-- optical axis, technical centre line -->
  <line x1="126" y1="250" x2="304" y2="250" stroke="#848c95" stroke-width="1" stroke-dasharray="14 3 2 3"/>

  <!-- ================= the eye ================= -->
  <path d="M 74,250 Q 96,218 118,250 Q 96,282 74,250 Z" fill="#ffffff" stroke="#0f1419" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="96" cy="250" r="8" fill="#e0e9f3" stroke="#2563a8" stroke-width="2"/>
  <circle cx="96" cy="250" r="2.6" fill="#2563a8"/>
  <text x="96" y="220" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">Observer</text>

  <!-- ============ subject plane, all four subjects at 1.00 m ============ -->
  <line x1="288" y1="82" x2="288" y2="434" stroke="#d8dee6" stroke-width="1.2"/>

  <!-- ================= extension lines ================= -->
  <g stroke="#a5abb2" stroke-width="1">
    <line x1="288" y1="228.88" x2="326" y2="228.88"/>
    <line x1="288" y1="271.12" x2="326" y2="271.12"/>
    <line x1="288" y1="202" x2="360" y2="202"/>
    <line x1="288" y1="298" x2="360" y2="298"/>
    <line x1="288" y1="173.2" x2="394" y2="173.2"/>
    <line x1="288" y1="326.8" x2="394" y2="326.8"/>
    <line x1="288" y1="86.8" x2="428" y2="86.8"/>
    <line x1="288" y1="413.2" x2="428" y2="413.2"/>
  </g>

  <!-- ====== subject extents, nested about the axis, stepped for legibility ====== -->
  <g stroke="#0d9668" stroke-width="2" stroke-linecap="butt">
    <line x1="322" y1="228.88" x2="322" y2="271.12"/>
    <line x1="318" y1="228.88" x2="326" y2="228.88"/>
    <line x1="318" y1="271.12" x2="326" y2="271.12"/>

    <line x1="356" y1="202" x2="356" y2="298"/>
    <line x1="352" y1="202" x2="360" y2="202"/>
    <line x1="352" y1="298" x2="360" y2="298"/>

    <line x1="390" y1="173.2" x2="390" y2="326.8"/>
    <line x1="386" y1="173.2" x2="394" y2="173.2"/>
    <line x1="386" y1="326.8" x2="394" y2="326.8"/>

    <line x1="424" y1="86.8" x2="424" y2="413.2"/>
    <line x1="420" y1="86.8" x2="428" y2="86.8"/>
    <line x1="420" y1="413.2" x2="428" y2="413.2"/>
  </g>

  <!-- key numerals, matched to the table rows -->
  <g font-size="13" font-weight="700" fill="#0f1419">
    <text x="336" y="243.9">1</text>
    <text x="370" y="217">2</text>
    <text x="404" y="188.2">3</text>
    <text x="438" y="101.8">4</text>
  </g>

  <!-- ================= distance dimension ================= -->
  <line x1="96" y1="270" x2="96" y2="434" stroke="#bdc2c7" stroke-width="1"/>
  <g stroke="#5b6672" stroke-width="1">
    <line x1="96" y1="422" x2="96" y2="434"/>
    <line x1="288" y1="422" x2="288" y2="434"/>
    <line x1="96" y1="428" x2="164" y2="428"/>
    <line x1="220" y1="428" x2="288" y2="428"/>
  </g>
  <text x="192" y="432.5" font-size="13" font-weight="700" fill="#0f1419" text-anchor="middle">1.00 m</text>

  <!-- ================= table ================= -->
  <g font-size="11" font-weight="600" fill="#5b6672" letter-spacing="1">
    <text x="494" y="138">SUBJECT</text>
    <text x="700" y="138" text-anchor="end">REAL SIZE</text>
    <text x="786" y="138" text-anchor="end">ANGLE</text>
    <text x="806" y="138">TO SCALE</text>
  </g>
  <line x1="470" y1="148" x2="904" y2="148" stroke="#8c949c" stroke-width="1"/>
  <g stroke="#d8dee6" stroke-width="1">
    <line x1="470" y1="208" x2="904" y2="208"/>
    <line x1="470" y1="256" x2="904" y2="256"/>
    <line x1="470" y1="304" x2="904" y2="304"/>
    <line x1="470" y1="352" x2="904" y2="352"/>
  </g>

  <g font-size="13" font-weight="700" fill="#0f1419">
    <text x="470" y="184">1</text>
    <text x="470" y="232">2</text>
    <text x="470" y="280">3</text>
    <text x="470" y="328">4</text>
  </g>

  <g font-size="12.5" font-weight="600" fill="#0f1419">
    <text x="494" y="184">Face</text>
    <text x="494" y="232">Head and shoulders</text>
    <text x="494" y="280">Seated upper body</text>
    <text x="494" y="328">Standing body</text>
  </g>

  <g font-size="13" font-weight="700" fill="#0f1419" text-anchor="end">
    <text x="700" y="184">0.22 m</text>
    <text x="700" y="232">0.50 m</text>
    <text x="700" y="280">0.80 m</text>
    <text x="700" y="328">1.70 m</text>

    <text x="786" y="184">12.6 deg</text>
    <text x="786" y="232">28.1 deg</text>
    <text x="786" y="280">43.6 deg</text>
    <text x="786" y="328">80.7 deg</text>
  </g>

  <rect x="806" y="175" width="98" height="8" rx="3" fill="#eaedf1" stroke="none"/>
  <rect x="806" y="223" width="98" height="8" rx="3" fill="#eaedf1" stroke="none"/>
  <rect x="806" y="271" width="98" height="8" rx="3" fill="#eaedf1" stroke="none"/>
  <rect x="806" y="319" width="98" height="8" rx="3" fill="#eaedf1" stroke="none"/>

  <rect x="806" y="175" width="15.3" height="8" rx="3" fill="#ddf0ea" stroke="#0d9668" stroke-width="1.5"/>
  <rect x="806" y="223" width="34.1" height="8" rx="3" fill="#ddf0ea" stroke="#0d9668" stroke-width="1.5"/>
  <rect x="806" y="271" width="52.9" height="8" rx="3" fill="#ddf0ea" stroke="#0d9668" stroke-width="1.5"/>
  <rect x="806" y="319" width="98" height="8" rx="3" fill="#ddf0ea" stroke="#0d9668" stroke-width="1.5"/>

  <text x="470" y="372" font-size="11.5" font-weight="400" fill="#5b6672">Subtended angle = 2 * atan(h / 2d), with d = 1.00 m for all four rows.</text>

  <!-- ================= footnote ================= -->
  <line x1="56" y1="446" x2="904" y2="446" stroke="#d8dee6" stroke-width="1"/>
  <text x="56" y="466" font-size="11.5" font-weight="400" fill="#5b6672">A 10 cm device reaches 12.6 deg - a life-size face - at 45 cm, where a phone already sits.</text>
  <text x="56" y="482" font-size="11.5" font-weight="400" fill="#5b6672">FaceTime at 40 cm subtends 19.9 deg; a real person at 1.2 m subtends 10.5 deg.</text>

</svg>
