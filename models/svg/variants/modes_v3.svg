<text x="56" y="488" font-size="11.5" font-weight="400" fill="#5b6672">Both are legitimate. Conflating them is the easiest technical error in this project.</text>
<text x="904" y="488" text-anchor="end" font-size="11.5" font-weight="400" fill="#5b6672">Not to scale: axial and transverse scales differ.</text>
