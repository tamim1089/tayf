<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Presence is an angle">
<title>Presence is an angle</title>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

  <text x="56" y="40" font-size="19" font-weight="600" fill="#0f1419">Presence is an angle</text>
  <text x="56" y="64" font-size="13" font-weight="400" fill="#5b6672">Angular size, not physical size, is what the eye receives - match the angle and you match the presence.</text>

  <rect x="56" y="82" width="368" height="366" rx="5" fill="#f4f7fa"/>
  <rect x="448" y="82" width="456" height="366" rx="5" fill="#ffffff"/>
  <path d="M 453 82 H 899 A 5 5 0 0 1 904 87 V 122 H 448 V 87 A 5 5 0 0 1 453 82 Z" fill="#f4f7fa"/>
  <rect x="56" y="82" width="368" height="366" rx="5" fill="none" stroke="#d8dee6" stroke-width="1"/>
  <rect x="448" y="82" width="456" height="366" rx="5" fill="none" stroke="#d8dee6" stroke-width="1"/>
  <line x1="448" y1="122" x2="904" y2="122" stroke="#d8dee6" stroke-width="1"/>

  <text x="72" y="102" font-size="11.5" font-weight="400" fill="#5b6672">Dashed pairs are lines of sight.</text>

  <line x1="292" y1="100" x2="292" y2="404" stroke="#d8dee6" stroke-width="1"/>
  <line x1="124" y1="252" x2="292" y2="252" stroke="#5b6672" stroke-width="1" stroke-dasharray="2 5" opacity="0.65"/>

  <g stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round">
    <line x1="124" y1="252" x2="292" y2="109.2"/>
    <line x1="124" y1="252" x2="292" y2="184.8"/>
    <line x1="124" y1="252" x2="292" y2="210"/>
    <line x1="124" y1="252" x2="292" y2="233.52"/>
    <line x1="124" y1="252" x2="292" y2="270.48"/>
    <line x1="124" y1="252" x2="292" y2="294"/>
    <line x1="124" y1="252" x2="292" y2="319.2"/>
    <line x1="124" y1="252" x2="292" y2="394.8"/>
  </g>

  <rect x="292" y="109.2" width="96" height="285.6" rx="4" fill="#0d9668" fill-opacity="0.10" stroke="#0d9668" stroke-width="2"/>
  <rect x="292" y="184.8" width="78" height="134.4" rx="3" fill="#0d9668" fill-opacity="0.10" stroke="#0d9668" stroke-width="2"/>
  <rect x="292" y="210" width="60" height="84" rx="3" fill="#0d9668" fill-opacity="0.10" stroke="#0d9668" stroke-width="2"/>
  <rect x="292" y="233.52" width="42" height="36.96" rx="3" fill="#0d9668" fill-opacity="0.10" stroke="#0d9668" stroke-width="2"/>

  <path d="M 88 252 C 96 237 116 237 124 252 C 116 267 96 267 88 252 Z" fill="#ffffff" stroke="#0f1419" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="107" cy="252" r="7.4" fill="none" stroke="#0f1419" stroke-width="1.4"/>
  <circle cx="107" cy="252" r="3.4" fill="#0f1419"/>
  <text x="106" y="292" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f1419">Eye</text>

  <line x1="124" y1="306" x2="124" y2="420" stroke="#d8dee6" stroke-width="1"/>
  <line x1="292" y1="400" x2="292" y2="420" stroke="#d8dee6" stroke-width="1"/>
  <line x1="132" y1="414" x2="178" y2="414" stroke="#5b6672" stroke-width="1"/>
  <line x1="238" y1="414" x2="284" y2="414" stroke="#5b6672" stroke-width="1"/>
  <path d="M 124 414 L 132 410.6 L 132 417.4 Z" fill="#5b6672"/>
  <path d="M 292 414 L 284 410.6 L 284 417.4 Z" fill="#5b6672"/>
  <text x="208" y="418.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1419">1.00 m</text>
  <text x="208" y="435" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">same for all four subjects</text>

  <text x="472" y="107" font-size="12.5" font-weight="600" fill="#0f1419">Subject, at 1.00 m</text>
  <text x="776" y="107" text-anchor="end" font-size="11.5" font-weight="600" fill="#5b6672">Device at 45 cm</text>
  <text x="880" y="107" text-anchor="end" font-size="11.5" font-weight="600" fill="#5b6672">Angle</text>

  <line x1="472" y1="200" x2="880" y2="200" stroke="#d8dee6" stroke-width="1"/>
  <line x1="472" y1="277" x2="880" y2="277" stroke="#d8dee6" stroke-width="1"/>
  <line x1="472" y1="355" x2="880" y2="355" stroke="#d8dee6" stroke-width="1"/>

  <path d="M 476 161 L 509.80 157.28 A 34 34 0 0 1 509.80 164.72 Z" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 476 238 L 508.99 229.75 A 34 34 0 0 1 508.99 246.25 Z" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 476 316 L 507.57 303.37 A 34 34 0 0 1 507.57 328.63 Z" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 476 393 L 501.91 370.98 A 34 34 0 0 1 501.91 415.02 Z" fill="#0d9668" fill-opacity="0.14" stroke="#0d9668" stroke-width="1.5" stroke-linejoin="round"/>

  <text x="538" y="155" font-size="13.5" font-weight="600" fill="#0f1419">Face</text>
  <text x="538" y="174" font-size="11.5" font-weight="400" fill="#5b6672">0.22 m tall - innermost cone</text>
  <text x="776" y="166" text-anchor="end" font-size="12.5" font-weight="600" fill="#2563a8">0.10 m</text>
  <text x="880" y="168" text-anchor="end" font-size="18" font-weight="700" fill="#0f1419">12.6 deg</text>

  <text x="538" y="232" font-size="13.5" font-weight="600" fill="#0f1419">Head and shoulders</text>
  <text x="538" y="251" font-size="11.5" font-weight="400" fill="#5b6672">0.50 m tall</text>
  <text x="776" y="243" text-anchor="end" font-size="12.5" font-weight="600" fill="#2563a8">0.23 m</text>
  <text x="880" y="245" text-anchor="end" font-size="18" font-weight="700" fill="#0f1419">28.1 deg</text>

  <text x="538" y="310" font-size="13.5" font-weight="600" fill="#0f1419">Seated upper body</text>
  <text x="538" y="329" font-size="11.5" font-weight="400" fill="#5b6672">0.80 m tall</text>
  <text x="776" y="321" text-anchor="end" font-size="12.5" font-weight="600" fill="#2563a8">0.36 m</text>
  <text x="880" y="323" text-anchor="end" font-size="18" font-weight="700" fill="#0f1419">43.6 deg</text>

  <text x="538" y="387" font-size="13.5" font-weight="600" fill="#0f1419">Standing body</text>
  <text x="538" y="406" font-size="11.5" font-weight="400" fill="#5b6672">1.70 m tall - outermost cone</text>
  <text x="776" y="398" text-anchor="end" font-size="12.5" font-weight="600" fill="#2563a8">0.77 m</text>
  <text x="880" y="400" text-anchor="end" font-size="18" font-weight="700" fill="#0f1419">80.7 deg</text>

  <text x="56" y="470" font-size="11.5" font-weight="400" fill="#5b6672">A 10 cm device reaches 12.6 deg - a life-size face - at 45 cm, where a phone already sits.</text>
  <text x="56" y="486" font-size="11.5" font-weight="400" fill="#5b6672">FaceTime at 40 cm subtends 19.9 deg; a real person at 1.2 m subtends 10.5 deg.</text>

</g>
</svg>
