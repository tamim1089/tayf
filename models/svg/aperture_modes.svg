<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-sans-serif,system-ui,sans-serif"><rect width="860" height="470" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161c"/></marker></defs><text x="30" y="34" font-size="17" fill="#12161c" text-anchor="start" font-weight="600" font-style="normal">The two aperture modes — name which one you mean</text><text x="30" y="56" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">Conflating these is the easiest technical error in this project.</text><text x="220" y="96" font-size="14.5" fill="#12161c" text-anchor="middle" font-weight="700" font-style="normal">IN-FRONT  (Law 1)</text><text x="220" y="116" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">image nearer you than the device</text><circle cx="70" cy="250" r="11" fill="none" stroke="#12161c" stroke-width="2"/><circle cx="70" cy="250" r="4" fill="#12161c"/><text x="70" y="282" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">eye</text><rect x="325" y="175.0" width="10" height="150" fill="#dfe6ee" fill-opacity="1.0" stroke="#12161c" stroke-width="2" rx="2"/><text x="330" y="163.0" font-size="11.5" fill="#12161c" text-anchor="middle" font-weight="600" font-style="normal">aperture D</text><rect x="189" y="219.0" width="32" height="62" fill="#12a37a" fill-opacity="0.18" stroke="#12a37a" stroke-width="2.2" rx="4"/><text x="205" y="301.0" font-size="11.5" fill="#12a37a" text-anchor="middle" font-weight="600" font-style="normal">image W</text><line x1="81" y1="250" x2="370" y2="163.46153846153845" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="4 4"/><line x1="81" y1="250" x2="370" y2="336.53846153846155" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="4 4"/><text x="220" y="388" font-size="20" fill="#12161c" text-anchor="middle" font-weight="700" font-style="normal">W &#60;= D</text><text x="220" y="412" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">a 20 cm device shows a 20 cm head</text><text x="220" y="434" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">in your own space — rule 4 strict</text><line x1="440" y1="80" x2="440" y2="440" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 5"/><text x="650" y="96" font-size="14.5" fill="#12161c" text-anchor="middle" font-weight="700" font-style="normal">PORTAL  (Law 2)</text><text x="650" y="116" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">image beyond the device</text><circle cx="500" cy="250" r="11" fill="none" stroke="#12161c" stroke-width="2"/><circle cx="500" cy="250" r="4" fill="#12161c"/><text x="500" y="282" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">eye</text><rect x="630" y="219.0" width="10" height="62" fill="#dfe6ee" fill-opacity="1.0" stroke="#12161c" stroke-width="2" rx="2"/><text x="635" y="207.0" font-size="11.5" fill="#12161c" text-anchor="middle" font-weight="600" font-style="normal">aperture D</text><rect x="766" y="175.0" width="32" height="150" fill="#12a37a" fill-opacity="0.18" stroke="#12a37a" stroke-width="2.2" rx="4"/><text x="782" y="345.0" font-size="11.5" fill="#12a37a" text-anchor="middle" font-weight="600" font-style="normal">image W</text><line x1="511" y1="250" x2="822" y2="176.05925925925925" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="4 4"/><line x1="511" y1="250" x2="822" y2="323.94074074074075" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="4 4"/><text x="650" y="388" font-size="20" fill="#12161c" text-anchor="middle" font-weight="700" font-style="normal">W = D · (b / a)</text><text x="650" y="412" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">a 20 cm device shows a standing person at 2.55 m</text><text x="650" y="434" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">unbounded — but you look through a frame</text></svg>