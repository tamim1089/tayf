<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-sans-serif,system-ui,sans-serif"><rect width="860" height="470" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161c"/></marker></defs><text x="30" y="34" font-size="17" fill="#12161c" text-anchor="start" font-weight="600" font-style="normal">Optical efficiency cascade — where 75% of the light goes</text><text x="30" y="56" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">The beamsplitter is crossed twice, costing ~50% each time. This sets the source-panel luminance.</text><rect x="250" y="110" width="509.99999999999994" height="40" fill="#dfe6ee" fill-opacity="1" stroke="#12161c" stroke-width="1.8" rx="4"/><text x="240" y="135" font-size="12.5" fill="#12161c" text-anchor="end" font-weight="600" font-style="normal">source panel</text><text x="258" y="135" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">100%</text><text x="772.0" y="135" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">assumed</text><rect x="250" y="172" width="254.99999999999997" height="40" fill="#c9a227" fill-opacity="0.5" stroke="#12161c" stroke-width="1.8" rx="4"/><text x="240" y="197" font-size="12.5" fill="#12161c" text-anchor="end" font-weight="600" font-style="normal">beamsplitter, pass 1</text><text x="258" y="197" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">50%</text><text x="517.0" y="197" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">reflect toward retroreflector</text><rect x="250" y="234" width="254.99999999999997" height="40" fill="#c9a227" fill-opacity="0.5" stroke="#12161c" stroke-width="1.8" rx="4"/><text x="240" y="259" font-size="12.5" fill="#12161c" text-anchor="end" font-weight="600" font-style="normal">retroreflector return</text><text x="258" y="259" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">50%</text><text x="517.0" y="259" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">eta_RR UNMEASURED - assumed 1.0</text><rect x="250" y="296" width="127.49999999999999" height="40" fill="#c9a227" fill-opacity="0.5" stroke="#12161c" stroke-width="1.8" rx="4"/><text x="240" y="321" font-size="12.5" fill="#12161c" text-anchor="end" font-weight="600" font-style="normal">beamsplitter, pass 2</text><text x="258" y="321" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">25%</text><text x="389.5" y="321" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">transmit toward viewer</text><rect x="250" y="358" width="127.49999999999999" height="40" fill="#12a37a" fill-opacity="0.5" stroke="#12161c" stroke-width="1.8" rx="4"/><text x="240" y="383" font-size="12.5" fill="#12161c" text-anchor="end" font-weight="600" font-style="normal">aerial image</text><text x="258" y="383" font-size="13" fill="#12161c" text-anchor="start" font-weight="700" font-style="normal">25%</text><text x="389.5" y="383" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">~250 cd/m2</text><text x="30" y="430" font-size="12" fill="#12161c" text-anchor="start" font-weight="400" font-style="normal">Indoor viewing needs roughly 100–300 cd/m² at the image, so a 1000 cd/m² panel closes it — IF eta_RR ~ 1.</text><text x="30" y="450" font-size="12" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">eta_RR is stated nowhere in the literature and is the single highest-value measurement this project can make.</text></svg>