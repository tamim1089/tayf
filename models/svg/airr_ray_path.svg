<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-sans-serif,system-ui,sans-serif"><rect width="860" height="470" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161c"/></marker></defs><text x="30" y="34" font-size="17" fill="#12161c" text-anchor="start" font-weight="600" font-style="normal">AIRR — how a real image forms in open air</text><text x="30" y="56" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">Light leaves the source, reflects off the beamsplitter to the retroreflector, returns along its own path, passes through the beamsplitter, and converges in mid-air.</text><line x1="300" y1="150" x2="470" y2="320" stroke="#6b7684" stroke-width="7" stroke-linecap="round" opacity="0.30"/><line x1="300" y1="150" x2="470" y2="320" stroke="#6b7684" stroke-width="2"/><text x="478" y="322" font-size="12" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">beamsplitter 45°</text><rect x="315" y="392" width="150" height="16" fill="#e9edf2" fill-opacity="1.0" stroke="#12161c" stroke-width="2" rx="2"/><text x="390" y="428" font-size="12" fill="#12161c" text-anchor="middle" font-weight="600" font-style="normal">source panel (LCD/OLED)</text><rect x="596" y="172" width="16" height="150" fill="#e6efff" fill-opacity="1.0" stroke="#3b7dd8" stroke-width="2" rx="2"/><path d="M596 180 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><path d="M596 202 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><path d="M596 224 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><path d="M596 246 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><path d="M596 268 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><path d="M596 290 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><path d="M596 312 l16 11 l-16 11" fill="none" stroke="#3b7dd8" stroke-width="1.4"/><text x="622" y="190" font-size="12" fill="#3b7dd8" text-anchor="start" font-weight="600" font-style="normal">retroreflector</text><text x="622" y="208" font-size="11" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">returns light along</text><text x="622" y="223" font-size="11" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">its incoming path</text><line x1="350" y1="392" x2="350" y2="206" stroke="#c9a227" stroke-width="2.2" marker-end="url(#a)"/><line x1="350" y1="200" x2="604" y2="200" stroke="#c9a227" stroke-width="2.2" marker-end="url(#a)"/><line x1="600" y1="207" x2="350" y2="207" stroke="#c9a227" stroke-width="2.2" marker-end="url(#a)"/><line x1="350" y1="207" x2="196" y2="236" stroke="#c9a227" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="430" y1="392" x2="430" y2="286" stroke="#c9a227" stroke-width="2.2" marker-end="url(#a)"/><line x1="430" y1="280" x2="604" y2="280" stroke="#c9a227" stroke-width="2.2" marker-end="url(#a)"/><line x1="600" y1="287" x2="430" y2="287" stroke="#c9a227" stroke-width="2.2" marker-end="url(#a)"/><line x1="430" y1="287" x2="196" y2="236" stroke="#c9a227" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#a)"/><ellipse cx="188" cy="236" rx="30" ry="44" fill="#12a37a" fill-opacity="0.16" stroke="#12a37a" stroke-width="2.4"/><text x="188" y="178" font-size="12.5" fill="#12a37a" text-anchor="middle" font-weight="700" font-style="normal">REAL IMAGE</text><text x="188" y="300" font-size="12" fill="#12a37a" text-anchor="middle" font-weight="600" font-style="normal">floats in open air</text><text x="188" y="317" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="400" font-style="normal">nothing is at this point</text><line x1="315" y1="372" x2="465" y2="372" stroke="#6b7684" stroke-width="1.4" marker-end="url(#b)"/><line x1="465" y1="372" x2="315" y2="372" stroke="#6b7684" stroke-width="1.4" marker-end="url(#b)"/><text x="390" y="366" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="600" font-style="italic">d</text><text x="30" y="352" font-size="11" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">the image sits as far from the</text><text x="30" y="366" font-size="11" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">beamsplitter as the source does</text><text x="30" y="456" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="400" font-style="normal">Unit magnification: image size = source size, exactly. Viewing angle 170° measured (Yamamoto 2017, 10.11370/isj.56.341).</text></svg>